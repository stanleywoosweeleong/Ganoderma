<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ganoderma BSR Manager</title>
<meta name="description" content="Assess oil palms for Ganoderma basal stem rot, plan multi-batch biocontrol, schedule Trichoderma brewing and track field trials.">
<meta name="theme-color" content="#faf7f0">
<meta name="color-scheme" content="light">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    /* paperwhite: warm off-white surfaces for long reading (no pure white) */
    --bg: #efebe1; --surface: #faf7f0; --surface-2: #f1ede3; --text: #1d2a22; --muted: #57645b;
    --border: #ddd6c7; --accent: #2d7a4f; --accent-ink: #faf7f0; --warn-bg: #fbefd8; --warn: #85500a;
    --bad-bg: #fde8e8; --bad: #9b1c1c;
    --head-bg: #faf7f0; --head-ink: #1f5c38; --head-muted: #57645b; --brand: #c8702f; --brand-lite: #e8a050; --brand-text: #9a5418;
    --tex: rgba(29,42,34,.045); --pick-line: rgba(45,122,79,.35); --toast-bg: #1d2a22; --toast-ink: #eef3ef;
    --s0: #2d7a4f; --s1: #b7a000; --s2: #d97706; --s3: #c2410c; --s4: #6b7280;
    --radius: 10px;
  }
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Noto Sans SC", "PingFang SC", sans-serif;
  }
  /* header (EM Brew style: dark band, accent stripe, pill language toggle) */
  header { background: var(--head-bg); color: var(--head-ink);
    padding: calc(18px + env(safe-area-inset-top, 0px)) 16px 16px; border-bottom: 3px solid var(--brand); }
  header .row { display: flex; align-items: flex-start; gap: 12px; justify-content: space-between; max-width: 900px; margin: 0 auto; }
  header h1 { font-size: 30px; line-height: 1.05; margin: 0; font-weight: 800; letter-spacing: -.02em; }
  header h1 .en { display: block; font-size: 12px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase;
    color: var(--brand-text); margin-top: 7px; }
  header p { margin: 10px auto 0; max-width: 900px; font-size: .82rem; font-weight: 500; color: var(--head-muted); }
  .langs { flex: none; display: flex; gap: 2px; padding: 2px; border-radius: 999px;
    background: rgba(45,122,79,.06); border: 1.5px solid var(--accent); }
  .langbtn { background: transparent; color: var(--accent); border: 0; border-radius: 999px; cursor: pointer;
    font: inherit; font-size: 13px; font-weight: 800; line-height: 1; padding: 8px 11px; letter-spacing: .05em; }
  .langbtn:active { background: rgba(45,122,79,.12); }
  .langbtn[aria-pressed="true"] { background: var(--accent); color: var(--surface); }
  .langbtn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  nav { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--border); }
  nav .tabs { display: flex; max-width: 900px; margin: 0 auto; overflow-x: auto; }
  nav button {
    flex: 1 0 auto; background: none; border: 0; border-bottom: 3px solid transparent; color: var(--muted);
    font: inherit; font-weight: 600; padding: 12px 14px; cursor: pointer;
  }
  nav button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
  main { max-width: 900px; margin: 0 auto; padding: 16px; }
  section[hidden] { display: none; }
  h2 { font-size: 1.15rem; margin: 4px 0 12px; }
  h3 { font-size: 1rem; margin: 0 0 8px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 14px; }
  .muted { color: var(--muted); font-size: .9rem; }
  .disclaimer { background: var(--warn-bg); color: var(--warn); border-radius: var(--radius); padding: 10px 12px; font-size: .9rem; margin-bottom: 14px; }
  label { display: block; font-weight: 600; margin: 10px 0 4px; font-size: .95rem; }
  label.check { display: flex; gap: 8px; align-items: flex-start; font-weight: 500; }
  label.check input { margin-top: 4px; width: 18px; height: 18px; flex: none; }
  input[type=number], input[type=date], input[type=text], select.field {
    width: 100%; font: inherit; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface); color: var(--text);
  }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  @media (max-width: 560px) { .grid2 { grid-template-columns: 1fr; } }
  .btn {
    display: inline-block; font: inherit; font-weight: 600; padding: 9px 14px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); margin: 12px 8px 0 0;
  }
  .btn.secondary { background: transparent; color: var(--accent); }
  a.btn { text-decoration: none; }
  .share { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; margin-top: 24px; }
  .shareqr { flex: none; width: 150px; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: #fff; line-height: 0; }
  .shareqr svg { width: 100%; height: auto; display: block; }
  .sharebody { flex: 1 1 220px; min-width: 0; }
  .sharebody h2 { margin-top: 0; }
  .shareurl { font-weight: 600; overflow-wrap: anywhere; margin: 6px 0 0; }
  .sharestatus { display: inline-block; margin-top: 12px; color: var(--accent); font-weight: 600; }
  @media (max-width: 480px) { .share { justify-content: center; } .sharebody { text-align: center; } .sharebody .btn { margin: 12px 4px 0; } }
  .btn.danger { background: transparent; color: var(--bad); border-color: var(--bad); }
  .stage-pill { display: inline-block; padding: 2px 10px; border-radius: 999px; color: #fff; font-weight: 700; font-size: .85rem; }
  .s0 { background: var(--s0); } .s1 { background: #f6d77a; color: #5c4300; } .s2 { background: #f7c08a; color: #6e3300; }
  .s3 { background: var(--s3); } .s4 { background: var(--s4); }
  .result { font-size: 1.1rem; margin-top: 12px; }
  .warn { background: var(--warn-bg); color: var(--warn); border-radius: 8px; padding: 8px 10px; margin: 6px 0; font-size: .92rem; }
  .stepno { display: inline-flex; align-items: center; justify-content: center; width: 1.45em; height: 1.45em; margin-right: 6px;
    border-radius: 50%; background: var(--brand); color: #fff; font-size: .78em; font-weight: 800; vertical-align: .08em; }
  nav button[aria-selected="false"] .stepno { background: var(--muted); }
  .flowlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  @media (min-width: 640px) { .flowlist { grid-template-columns: repeat(4, 1fr); } }
  .flowlist button { width: 100%; text-align: left; font: inherit; color: var(--text); background: var(--surface-2);
    border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; cursor: pointer; display: block; }
  .flowlist button:active { transform: scale(.98); }
  .flowlist b { display: inline; }
  .flowlist span:not(.stepno) { display: block; margin-top: 4px; font-size: .85rem; color: var(--muted); }
  .timeline { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 10px; margin: 0 0 6px; -webkit-overflow-scrolling: touch; }
  .timeline a { flex: none; text-decoration: none; color: var(--text); background: var(--surface-2); border: 1.5px solid var(--border);
    border-radius: 10px; padding: 6px 10px; font-size: .82rem; line-height: 1.3; text-align: center; min-width: 76px; }
  .timeline a b { display: block; font-size: .9rem; }
  .timeline a.done { border-color: var(--accent); background: var(--surface); }
  .timeline a.done b::before { content: "✓ "; color: var(--accent); }
  .timeline a.maintenance { border-style: dashed; }
  .agents { display: flex; flex-wrap: wrap; gap: 3px; justify-content: center; margin-top: 5px; }
  .batch .head .agents { justify-content: flex-start; margin-top: 0; flex-basis: 100%; }
  .agent { display: inline-block; font-size: .7rem; font-weight: 700; line-height: 1.2; padding: 2px 6px; border-radius: 999px; white-space: nowrap; }
  .agent-tricho { background: #dcefe2; color: #1f5c38; }
  .agent-bacteria { background: #e3ecf8; color: #1d4a7a; }
  .agent-amf { background: #f6ead9; color: #7a4a12; }
  .agent-sanitation { background: #ececec; color: #4a4a4a; }
  .progress { font-weight: 700; margin: 8px 0 4px; }
  .progress .bar { height: 8px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); overflow: hidden; margin-top: 6px; }
  .progress .bar i { display: block; height: 100%; background: var(--accent); }
  .batch .donebox { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-weight: 700; color: var(--accent); }
  .batch .donebox input { width: 20px; height: 20px; }
  .batch.is-done { opacity: .75; }
  .batch { scroll-margin-top: 70px; }
  #p-settings summary { cursor: pointer; font-weight: 700; color: var(--accent); padding: 6px 0; }
  #p-settings[open] summary { margin-bottom: 4px; }
  #p-summary { margin: 0 0 6px; }
  .disclaimer[hidden] { display: none; }
  .provisional { border: 2px dashed var(--warn); color: var(--text); background: var(--warn-bg); border-radius: 8px; padding: 10px 12px; margin: 4px 0 10px; font-size: .92rem; }
  .provisional b { color: var(--warn); }
  .basis { margin: 4px 0 6px; font-size: .8rem; color: var(--muted); line-height: 1.45; }
  .basis a { color: var(--accent); }
  .basis .tag { display: inline-block; font-weight: 700; font-size: .72rem; padding: 0 6px; border-radius: 5px; border: 1px solid currentColor; margin-right: 2px; }
  .basis-assumption .tag { color: var(--bad); }
  .basis-label .tag { color: var(--accent); }
  .basis-practice .tag, .basis-study .tag { color: var(--muted); }
  .warn.safety { margin: 6px 0 2px; font-weight: 600; border-left: 4px solid var(--warn); }
  .bad { background: var(--bad-bg); color: var(--bad); border-radius: 8px; padding: 8px 10px; margin: 6px 0; font-size: .92rem; }
  .batch { border-left: 4px solid var(--accent); padding: 8px 12px; margin: 10px 0; background: var(--surface-2); border-radius: 0 8px 8px 0; }
  .batch.maintenance { border-left-color: var(--s1); }
  .batch.census { border-left-color: var(--s4); }
  .batch .head { display: flex; flex-wrap: wrap; gap: 4px 12px; font-weight: 700; }
  .batch .head .kind { font-weight: 500; color: var(--muted); }
  .batch ul { margin: 6px 0 0; padding-left: 20px; }
  .table-wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: .9rem; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .counts { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .counts label { font-size: .8rem; margin: 6px 0 2px; }
  @media (max-width: 420px) { .counts { grid-template-columns: repeat(3, 1fr); } }
  .level { display: inline-block; font-size: .8rem; font-weight: 700; border-radius: 6px; padding: 1px 8px; }
  /* light tints with dark text: easier to read on phones / in sunlight than saturated fills */
  .lv3 { background: var(--s0); color: #fff; } .lv2 { background: #fbe7b5; color: #6b4400; box-shadow: inset 0 0 0 1px #e9c97a; }
  .lv1 { background: #f9dcc4; color: #7a3410; box-shadow: inset 0 0 0 1px #eab48a; } .lv0 { background: var(--s4); color: #fff; }
  .level.weak { background: transparent; color: var(--bad); border: 1.5px solid var(--bad); font-weight: 600; white-space: normal; }
  /* On weak entries the study-type badge is neutral grey, so a green
     "Field trial" never reads as a quality stamp next to the warning. */
  .level.muted-level { background: transparent; color: var(--muted); border: 1.5px solid var(--border); }
  .ev p { margin: 4px 0; }
  .buy { border-top: 1px solid var(--border); margin-top: 10px; padding-top: 8px; }
  .buy h4 { margin: 0 0 6px; font-size: .95rem; }
  .product { background: var(--surface-2); border-radius: 8px; padding: 8px 10px; margin: 6px 0; font-size: .92rem; }
  .product > div { margin-top: 2px; }
  .ev a { color: var(--accent); word-break: break-word; }
  .kpi { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 10px; }
  .kpi div { background: var(--surface-2); border-radius: 8px; padding: 10px; }
  .kpi b { display: block; font-size: 1.4rem; font-variant-numeric: tabular-nums; }
  svg.chart { width: 100%; height: auto; display: block; margin-top: 8px; }
  /* update toast (EM Brew style) */
  #toast { position: fixed; z-index: 10; left: 50%; transform: translateX(-50%);
    bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: calc(100% - 32px); max-width: 420px;
    display: none; align-items: center; gap: 10px; background: var(--toast-bg); color: var(--toast-ink);
    border: 1.5px solid var(--accent); border-radius: var(--radius); padding: 10px 10px 10px 15px;
    box-shadow: 0 8px 24px rgba(0,0,0,.3); font-size: .9rem; font-weight: 700; line-height: 1.35;
    animation: toastin .25s ease-out; }
  #toast.show { display: flex; }
  #toast > span { flex: 1; min-width: 0; }
  #toast button { flex: none; border: 0; border-radius: 9px; cursor: pointer; font: inherit; font-weight: 800; }
  #toast-reload { background: var(--accent); color: var(--accent-ink); padding: 10px 14px; }
  #toast button.x { background: transparent; color: var(--toast-ink); opacity: .75; padding: 10px 8px; font-size: 1rem; }
  @keyframes toastin { from { opacity: 0; transform: translate(-50%, 12px); } to { opacity: 1; transform: translate(-50%, 0); } }

  /* first-launch language picker (EM Brew style) */
  #langpick { position: fixed; inset: 0; z-index: 20; overflow: auto;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    padding: calc(24px + env(safe-area-inset-top, 0px)) 16px calc(24px + env(safe-area-inset-bottom, 0px));
    background-color: var(--bg);
    background-image:
      repeating-linear-gradient(90deg, var(--tex) 0 1px, transparent 1px 4px),
      repeating-linear-gradient(0deg, var(--tex) 0 1px, transparent 1px 4px); }
  #langpick[hidden] { display: none; }
  #langpick:focus { outline: 0; }
  #langpick img { width: 84px; height: 84px; border-radius: 22px; box-shadow: 0 6px 18px rgba(0,0,0,.25); }
  .lptitle { font-size: 26px; font-weight: 800; line-height: 1.1; text-align: center; letter-spacing: -.02em; margin: 0 0 8px; }
  .lptitle span { display: block; font-size: 12px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase;
    color: var(--accent); margin-top: 8px; }
  #langpick button { width: min(18rem, 84vw); min-height: 58px; border: 2px solid var(--pick-line); border-radius: 16px;
    background: var(--surface); color: var(--text); font: inherit; font-size: 19px; font-weight: 800; line-height: 1;
    cursor: pointer; transition: transform .15s, border-color .15s; }
  #langpick button:active { transform: scale(.97); border-color: var(--accent); }
  #langpick button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  body.picking { overflow: hidden; }

  /* back-to-top button: appears after scrolling, sits above the update toast */
  .totop { position: fixed; z-index: 9; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    width: 48px; height: 48px; border-radius: 50%; border: 1.5px solid var(--accent); background: var(--surface);
    color: var(--accent); font: inherit; font-size: 22px; font-weight: 800; line-height: 1; cursor: pointer;
    box-shadow: 0 4px 12px rgba(29,42,34,.18); }
  .totop[hidden] { display: none; }
  .totop:active { transform: scale(.94); }
  .totop:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  body.has-toast .totop { bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
  @media print { .totop { display: none !important; } }
  /* Phones: a fixed bottom tab bar — all five tabs visible, no sideways
     scrolling, within thumb reach. Wider screens keep the top bar. */
  @media (max-width: 640px) {
    nav { position: fixed; top: auto; bottom: 0; left: 0; right: 0; z-index: 8;
      border-bottom: 0; border-top: 1px solid var(--border); box-shadow: 0 -4px 14px rgba(0,0,0,.08);
      padding-bottom: env(safe-area-inset-bottom, 0px); }
    nav .tabs { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); overflow: visible; }
    nav button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
      min-width: 0; padding: 7px 2px 8px; font-size: 11.5px; line-height: 1.15;
      border-bottom: 0; border-top: 3px solid transparent; }
    nav button > span:last-child { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    nav button[aria-selected="true"] { border-top-color: var(--accent); }
    nav button .stepno { margin: 0; width: 24px; height: 24px; font-size: 13px; }
    body { padding-bottom: calc(66px + env(safe-area-inset-bottom, 0px)); }
    .totop { bottom: calc(78px + env(safe-area-inset-bottom, 0px)); }
    body.has-toast .totop { bottom: calc(146px + env(safe-area-inset-bottom, 0px)); }
    #toast { bottom: calc(78px + env(safe-area-inset-bottom, 0px)); }
    .batch { scroll-margin-top: 12px; }
  }
  .stepno.evi svg { display: block; }

  @media print {
    header, nav, .btn, .no-print, #toast { display: none !important; }
    body { background: #fff; color: #000; }
    .card { border: 0; padding: 0; }
  }
</style>
</head>
<body>
<header>
  <div class="row">
    <h1>Ganoderma<span class="en" data-i18n="app.short">BSR Manager</span></h1>
    <div class="langs" id="langs" role="group" aria-label="Language · 语言 · Bahasa">
      <button class="langbtn" type="button" data-lang="en" lang="en">EN</button>
      <button class="langbtn" type="button" data-lang="zh" lang="zh-Hans">中文</button>
      <button class="langbtn" type="button" data-lang="ms" lang="ms">BM</button>
    </div>
  </div>
  <p data-i18n="app.tagline"></p>
</header>

<nav>
  <div class="tabs" role="tablist">
    <button role="tab" data-tab="assess" aria-selected="true" ><span class="stepno">1</span><span data-i18n="tab.assess">Assess</span></button>
    <button role="tab" data-tab="plan" aria-selected="false" ><span class="stepno">2</span><span data-i18n="tab.plan">Plan</span></button>
    <button role="tab" data-tab="brew" aria-selected="false" ><span class="stepno">3</span><span data-i18n="tab.brew">Brew</span></button>
    <button role="tab" data-tab="track" aria-selected="false" ><span class="stepno">4</span><span data-i18n="tab.track">Track</span></button>
    <button role="tab" data-tab="evidence" aria-selected="false"><span class="stepno evi" aria-hidden="true"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/></svg></span><span data-i18n="tab.evidence">Evidence</span></button>
  </div>
</nav>

<main>
  <div class="disclaimer" data-i18n="disclaimer"></div>

  <!-- ASSESS -->
  <section id="tab-assess">
    <div class="card flow">
      <h2 data-i18n="flow.h">How the treatment test works</h2>
      <ol class="flowlist">
        <li><button type="button" data-go="assess"><span class="stepno">1</span><b data-i18n="flow.1.t"></b><span data-i18n="flow.1.d"></span></button></li>
        <li><button type="button" data-go="plan"><span class="stepno">2</span><b data-i18n="flow.2.t"></b><span data-i18n="flow.2.d"></span></button></li>
        <li><button type="button" data-go="brew"><span class="stepno">3</span><b data-i18n="flow.3.t"></b><span data-i18n="flow.3.d"></span></button></li>
        <li><button type="button" data-go="track"><span class="stepno">4</span><b data-i18n="flow.4.t"></b><span data-i18n="flow.4.d"></span></button></li>
      </ol>
    </div>
    <div class="card">
      <h2 data-i18n="assess.h"></h2>
      <label class="check"><input type="checkbox" id="a-dead"> <span data-i18n="assess.dead"></span></label>
      <label class="check"><input type="checkbox" id="a-fruit"> <span data-i18n="assess.fruiting"></span></label>
      <label for="a-lesion" data-i18n="assess.lesion"></label>
      <input type="number" id="a-lesion" min="0" max="100" step="5" value="0" inputmode="decimal">
      <label for="a-foliar" data-i18n="assess.foliar"></label>
      <select id="a-foliar" class="field">
        <option value="none" data-i18n="foliar.none"></option>
        <option value="mild" data-i18n="foliar.mild"></option>
        <option value="severe" data-i18n="foliar.severe"></option>
      </select>
      <div class="result" id="a-result" aria-live="polite"></div>
      <button class="btn" id="a-toplan" data-i18n="assess.toPlan"></button>
      <p class="muted" data-i18n="assess.scale"></p>
    </div>
  </section>

  <!-- PLAN -->
  <section id="tab-plan" hidden>
    <div class="card no-print">
      <h2 data-i18n="plan.h"></h2>
      <p class="muted" id="p-summary"></p>
      <details id="p-settings">
      <summary data-i18n="plan.settings">Change plan settings</summary>
      <div class="grid2">
        <div>
          <label for="p-setting" data-i18n="plan.setting"></label>
          <select id="p-setting" class="field">
            <option value="mature" data-i18n="setting.mature"></option>
